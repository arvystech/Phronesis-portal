# ==============================================================================
# Phronesis Sunesis Admin ERP - Nginx Clean URL Rewrite Configuration Snippet
# Include this block inside your server { ... } block in nginx.conf
# ==============================================================================

# Static assets with caching
location ~* ^/(assets|public|css|js)/ {
    root /path/to/phronesis2/admin;
    expires 30d;
    add_header Cache-Control "public, no-transform";
    try_files $uri $uri/ =404;
}

# Admin clean routing
location /admin {
    alias /path/to/phronesis2/admin;
    index dashboard.html index.html;

    # Static assets under /admin/assets
    location ~* ^/admin/assets/(.*)$ {
        alias /path/to/phronesis2/admin/assets/$1;
        try_files $uri =404;
    }

    # Dynamic route: /admin/students/:id -> student-details.html
    rewrite ^/admin/students/([^/]+)/?$ /admin/student-details.html last;

    # Dynamic route: /admin/staff-applications/:id -> staff-application-detail.html
    rewrite ^/admin/staff-applications/([^/]+)/?$ /admin/staff-application-detail.html last;

    # Clean route rewrites
    rewrite ^/admin/dashboard/?$ /admin/dashboard.html last;
    rewrite ^/admin/students/?$ /admin/students.html last;
    rewrite ^/admin/students/new/?$ /admin/register-student.html last;
    rewrite ^/admin/register-student/?$ /admin/register-student.html last;
    rewrite ^/admin/staff-applications/?$ /admin/staff-applications.html last;
    rewrite ^/admin/apply-staff/?$ /admin/apply-staff.html last;
    rewrite ^/admin/orders/?$ /admin/orders.html last;
    rewrite ^/admin/settings/?$ /admin/settings.html last;
    rewrite ^/admin/profile/?$ /admin/profile.html last;
    rewrite ^/admin/login/?$ /admin/login.html last;
    rewrite ^/admin/?$ /admin/dashboard.html last;

    # Fallback to file, directory, or .html extension
    try_files $uri $uri/ $uri.html =404;
}
