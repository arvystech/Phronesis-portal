# ==============================================================================
# Phronesis Sunesis Multi-Portal - Nginx Clean URL Rewrite Configuration
# Include this block inside your server { ... } block in nginx.conf
# ==============================================================================

# Global/Shared static assets caching
location ~* ^/(assets|public)/ {
    root /path/to/Phronesis-portal;
    expires 30d;
    add_header Cache-Control "public, no-transform";
    try_files $uri /admin$uri =404;
}

# ------------------------------------------------------------------------------
# 1. Admin Portal Routing (/admin/*)
# ------------------------------------------------------------------------------
location /admin {
    alias /path/to/Phronesis-portal/admin;
    index dashboard.html index.html;

    # Admin static assets
    location ~* ^/admin/assets/(.*)$ {
        alias /path/to/Phronesis-portal/admin/assets/$1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Dynamic Admin detail routes
    rewrite ^/admin/students/([^/]+)/?$ /admin/student-details.html last;
    rewrite ^/admin/staffs/([^/]+)/attendance/?$ /admin/staff-attendance.html last;
    rewrite ^/admin/staffs/([^/]+)/?$ /admin/staff-details.html last;
    rewrite ^/admin/staff-applications/([^/]+)/?$ /admin/staff-application-detail.html last;

    # Clean Admin page routes (without .html)
    rewrite ^/admin/dashboard/?$ /admin/dashboard.html last;
    rewrite ^/admin/students/?$ /admin/students.html last;
    rewrite ^/admin/registrations/?$ /admin/students.html last;
    rewrite ^/admin/students/new/?$ /admin/register-student.html last;
    rewrite ^/admin/register-student/?$ /admin/register-student.html last;
    rewrite ^/admin/staffs/?$ /admin/staffs.html last;
    rewrite ^/admin/staffs/new/?$ /admin/register-staff.html last;
    rewrite ^/admin/register-staff/?$ /admin/register-staff.html last;
    rewrite ^/admin/staff-details/?$ /admin/staff-details.html last;
    rewrite ^/admin/staff-attendance/?$ /admin/staff-attendance.html last;
    rewrite ^/admin/staff-applications/?$ /admin/staff-applications.html last;
    rewrite ^/admin/apply-staff/?$ /admin/apply-staff.html last;
    rewrite ^/admin/apply/staff/?$ /admin/apply-staff.html last;
    rewrite ^/admin/orders/?$ /admin/orders.html last;
    rewrite ^/admin/payments/?$ /admin/orders.html last;
    rewrite ^/admin/settings/?$ /admin/settings.html last;
    rewrite ^/admin/profile/?$ /admin/profile.html last;
    rewrite ^/admin/login/?$ /admin/login.html last;

    # Admin root -> dashboard.html
    rewrite ^/admin/?$ /admin/dashboard.html last;

    # Fallback to existing file, directory, or .html extension
    try_files $uri $uri/ $uri.html =404;
}

